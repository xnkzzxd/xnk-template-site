name: Push XNK

# Notifikasi Web Push untuk semua coach di xnk.web.id (T-2240, docs/push/Setup.md di repo XNK).
#  - Tiap 5 menit (aksi "kirim"): ambil daftar coach yang push-nya menyala dari XNK Pusat, ambil antrean push tiap coach
#    langsung dari Apps Script coach itu, kirim dengan web-push, lalu lapor hasilnya ke coach yang sama.
#  - Run workflow → aksi "kunci" (sekali): tulis kunci publik VAPID (dihitung dari secret HUB_VAPID_PRIVATE) ke hub.json.
# Secret repo ini: HUB_VAPID_PRIVATE (kata sandi acak ≥ 32 karakter; tidak pernah dicetak) dan PUSAT_PUSH_SECRET (sama
# dengan Script Property PUSAT_PUSH_SECRET di XNK Pusat). Tanpa keduanya workflow selesai tanpa melakukan apa-apa.
# Log hanya berisi slug coach dan angka; isi notifikasi dan alamat perangkat tidak dicatat.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      aksi:
        description: 'kirim = kirim antrean sekarang · kunci = tulis kunci publik dari secret HUB_VAPID_PRIVATE ke hub.json'
        type: choice
        options: [kirim, kunci]
        default: kirim

permissions:
  contents: write

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Kode XNK yang sudah lulus pemeriksaan (tag hub-stable), seperti workflow Hub XNK.
      - name: Pilih versi kode XNK
        id: xnk
        run: |
          if git ls-remote --exit-code --tags https://github.com/xnkzzxd/XNK.git refs/tags/hub-stable >/dev/null; then
            echo "ref=hub-stable" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Ambil kode XNK
        uses: actions/checkout@v4
        with:
          repository: xnkzzxd/XNK
          ref: ${{ steps.xnk.outputs.ref }}
          path: _xnk

      - name: Kunci
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.aksi == 'kunci' }}
        env:
          HUB_VAPID_PRIVATE: ${{ secrets.HUB_VAPID_PRIVATE }}
        run: |
          node _xnk/apps-script/xnk-library/tools/hub-push.js kunci hub.json
          if ! git diff --quiet hub.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hub.json
            git commit -m "Hub: kunci publik push"
            git push
          fi

      - name: Pasang web-push
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.aksi == 'kirim' }}
        run: npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/wp" web-push@3.6.7

      - name: Kirim
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.aksi == 'kirim' }}
        env:
          NODE_PATH: ${{ runner.temp }}/wp/node_modules
          HUB_VAPID_PRIVATE: ${{ secrets.HUB_VAPID_PRIVATE }}
          PUSAT_PUSH_SECRET: ${{ secrets.PUSAT_PUSH_SECRET }}
        run: |
          if [ ! -f _xnk/apps-script/xnk-library/tools/hub-push.js ]; then
            echo "Kode XNK (${{ steps.xnk.outputs.ref }}) belum punya hub-push.js; dilewati."
            exit 0
          fi
          node _xnk/apps-script/xnk-library/tools/hub-push.js kirim hub.json
